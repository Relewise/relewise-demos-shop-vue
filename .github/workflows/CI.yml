name: CI

on: pull_request

jobs:
  build_vue:
    runs-on: ubuntu-latest
    name: Build Vue
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node Modules
        run: npm install

      - name: Test shopping assistant
        run: npm run test:unit -- --run src/components/__tests__/ConversationalSearchOverlay.test.ts

      - name: Build Vue/Typescript
        run: npm run build
   
